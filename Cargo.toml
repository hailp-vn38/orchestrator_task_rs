[package]
name = "orchestrator-flow"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Background Task, Followup, Reminder/Cron Scheduler and Wiki Auto-Flow Manager for multi-Orchestrator hosts"
license = "MIT OR Apache-2.0"

[lib]
name = "orchestrator_flow_rs"
path = "src/lib.rs"

[dependencies]
anydoc = "0.2.4"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
llm-wiki-rs = { path = "../llm-wiki-rs" }
lopdf = "0.45"
orchestrator-agent = { path = "../orchestrator_agent_rs" }
pdf-inspector = "1.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
orchestrator-agent = { path = "../orchestrator_agent_rs", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "test-util"] }
